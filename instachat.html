  <style>
body{margin:0;background:#000;font-family:Arial;color:#fff;text-align:center}
header{padding:16px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);color:#fff;font-weight:bold;font-size:20px}
.controls{background:#121212;padding:12px;border-radius:14px;margin:10px auto;max-width:400px;border:1px solid #262626}
input,select,button{width:92%;padding:12px;margin:5px;border-radius:10px;border:none}
button{background:linear-gradient(45deg,#fa7e1e,#d62976);color:#fff;font-weight:bold;cursor:pointer}
#chatBox{width:95%;max-width:400px;height:550px;margin:10px auto;background:#000;position:relative;border:1px solid #262626}
#chatHeader{background:#121212;color:#fff;padding:10px;display:flex;align-items:center;border-bottom:1px solid #262626}
#messages{padding:10px;height:430px;overflow-y:auto;display:flex;flex-direction:column}
.msg{max-width:75%;padding:8px 10px;border-radius:18px;font-size:14px;margin:3px 0}
.sent{background:linear-gradient(45deg,#fa7e1e,#d62976);align-self:flex-end;color:#fff}
.received{background:#262626;align-self:flex-start;color:#fff}

</head><body>
<header>📸 Fake Insta DM Generator</header>

<div class="controls">
<input id="instaName" placeholder="Username (e.g. _ayesha_.x)" value="_ayesha_.x" oninput="document.getElementById('hName').innerText=this.value">
<input type="file" id="instaAvatar" accept="image/*">
<select id="instaType"><option value="received">Received (Grey)</option><option value="sent">Sent (Blue)</option></select>
<input id="instaText" placeholder="Type message...">
<button onclick="addInsta()">Add Message</button>
<button onclick="document.getElementById('instaMessages').innerHTML=''" style="background:#111;color:#fff">Clear</button>
<button onclick="downloadInsta()" style="background:#000;color:#fff">📸 Download Screenshot</button>
</div>

<div id="instaBox">
<div id="instaHeader">
<img id="hImg" src="https://i.pravatar.cc/100?img=5">
<div><div id="hName" style="font-weight:bold;font-size:14px">_ayesha_.x</div><div style="font-size:11px;color:#999">Active now</div></div>
</div>
<div id="instaMessages">
<div class="small">Today 1:39 PM</div>
</div>
</div>


<div style="margin:15px 0;padding:10px;background:#f8fafc;border-radius:8px;">

    <input type="checkbox" id="agree" required style="margin-top:2px;">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
document.getElementById('instaAvatar').addEventListener('change',e=>{
let file=e.target.files[0]; if(!file) return;
let r=new FileReader(); r.onload=ev=>{document.getElementById('hImg').src=ev.target.result}; r.readAsDataURL(file);
});
function addInsta(){
let text=document.getElementById('instaText').value; if(!text) return;
let type=document.getElementById('instaType').value;
let div=document.createElement('div'); div.className='msg '+type; div.innerText=text;
document.getElementById('instaMessages').appendChild(div);
if(type=='sent'){
let seen=document.createElement('div'); seen.className='small'; seen.style.textAlign='right'; seen.innerText='Seen';
document.getElementById('instaMessages').appendChild(seen);
}
document.getElementById('instaText').value='';
document.getElementById('instaMessages').scrollTop=9999;
}
 function downloadChat(){
  if(!document.getElementById('agree').checked){
    alert("Please tick checkbox - Agree for fun only");
    return;
  }
  html2canvas(document.getElementById('chatBox'), {scale:2}).then(canvas => {
  
  const ctx = canvas.getContext('2d');
    
    // Footer watermark - 100% safe for 10 years
    ctx.fillStyle = "rgba(0,0,0,0.8)";
    ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
    ctx.fillStyle = "white";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";
    ctx.fillText("FAKE CHAT - FormatPure.github.io - For Fun Only", canvas.width/2, canvas.height - 10);
    
    // Diagonal light watermark
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.font = "bold 26px Arial";
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(-Math.PI/4);
    ctx.fillText("FAKE", 0, 0);
    ctx.restore();

    const link = document.createElement('a');
    link.download = 'fake-chat-formatpure.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.9);
    link.click();
  });
}
</script>
</body></html>
