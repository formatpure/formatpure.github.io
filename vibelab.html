<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VibeLab PRO FIXED</title>
<style>body{margin:0;background:#0a0a0f;color:#fff;font-family:Arial;text-align:center}
header{padding:16px;background:linear-gradient(90deg,#ff006a,#7a00ff)}
.tabs{display:flex;overflow-x:auto;background:#15151f;padding:8px;gap:8px}
.tab{padding:10px 18px;background:#232334;border-radius:20px;cursor:pointer;font-weight:bold;white-space:nowrap}
.tab.active{background:#ff006a}
.page{display:none;padding:15px}.page.active{display:block}
.box{background:#15151f;padding:16px;border-radius:16px;margin:12px auto;max-width:500px;border:1px solid #2a2a3a}
input,select,button,textarea{width:92%;max-width:450px;padding:13px;margin:6px;border-radius:12px;border:none;font-size:15px}
button{background:linear-gradient(90deg,#ff006a,#7a00ff);color:#fff;font-weight:bold}
canvas{background:#000;border-radius:12px;max-width:100%;margin-top:10px}
.rizz{font-size:42px;font-weight:900;color:#ff006a}</style>
</head><body>
<header><h1>💜 VibeLab</h1><p>Meme • Rizz • Captions • Roast</p>

</header>
<div class="tabs">
<div class="tab active" onclick="showTab(0)">🔥 Meme</div>
<div class="tab" onclick="showTab(1)">😎 Rizz</div>
<div class="tab" onclick="showTab(2)">✨ Caption</div>
<div class="tab" onclick="showTab(3)">💀 Roast</div>
</div>

<div class="page active" id="p0">
<div class="box">
<h3>🔥 Viral Meme Maker FIXED</h3>
<input type="file" id="memeFile" accept="image/*">
<input id="topText" placeholder="TOP TEXT" oninput="drawMeme()">
<input id="bottomText" placeholder="BOTTOM TEXT" oninput="drawMeme()">
<canvas id="memeCanvas"></canvas><br>
<button onclick="downloadMeme()">Download - No Watermark</button>
<p style="color:#999;font-size:12px">Upload → Type → Download</p>
</div>
</div>

<div class="page" id="p1">
<div class="box"><h3>😎 Rizz-O-Meter</h3>
<input id="n1" placeholder="Your Name"><input id="n2" placeholder="Crush Name">
<button onclick="checkRizz()">Check Rizz %</button><div id="rout" class="rizz"></div><p id="rtext"></p>
</div></div>

<div class="page" id="p2">
<div class="box"><h3>✨ Caption Lab</h3>
<select id="mood"><option>Baddie Vibe</option><option>Sad / Broken</option><option>Savage / Attitude</option><option>Soft / Love</option><option>Chill / Cool</option></select>
<button onclick="genCap()">Generate</button><textarea id="capout" rows="4"></textarea>
<button onclick="navigator.clipboard.writeText(capout.value);alert('Copied!')">Copy</button>
</div></div>

<div class="page" id="p3">
<div class="box"><h3>💀 Roast Generator</h3><input id="roastname" placeholder="Friend Name">
<button onclick="genRoast()">Roast 😂</button><h3 id="roastout" style="color:#ff4d6d"></h3>
</div></div>

<a href="index.html" style="color:#38bdf8;display:block;margin:20px">← Back</a>

<script>
function showTab(i){document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k==i));document.querySelectorAll('.page').forEach((p,k)=>p.classList.toggle('active',k==i))}

// FIXED MEME CODE
let memeImg=new Image();let canvas=document.getElementById('memeCanvas');let ctx=canvas.getContext('2d');
document.getElementById('memeFile').addEventListener('change',function(e){
let file=e.target.files[0]; if(!file) return;
let reader=new FileReader();
reader.onload=function(ev){memeImg.onload=function(){drawMeme()}; memeImg.src=ev.target.result;}
reader.readAsDataURL(file);
});
function drawMeme(){
if(!memeImg.src) return;
let w=600; let h=memeImg.height*(w/memeImg.width);
canvas.width=w; canvas.height=h;
ctx.drawImage(memeImg,0,0,w,h);
ctx.fillStyle='white';ctx.strokeStyle='black';ctx.lineWidth=5;ctx.font='bold 38px Impact';ctx.textAlign='center';
ctx.strokeText(document.getElementById('topText').value.toUpperCase(),w/2,50);
ctx.fillText(document.getElementById('topText').value.toUpperCase(),w/2,50);
ctx.strokeText(document.getElementById('bottomText').value.toUpperCase(),w/2,h-20);
ctx.fillText(document.getElementById('bottomText').value.toUpperCase(),w/2,h-20);
}
function downloadMeme(){if(!memeImg.src){alert('First upload image!');return;} let a=document.createElement('a');a.download='vibelab-meme.png';a.href=canvas.toDataURL();a.click()}

function checkRizz(){let a=n1.value,b=n2.value;let s=(a.length+b.length)*9+Math.floor(Math.random()*40);if(s>100)s=98;rout.innerText=s+'%';rtext.innerText=s>85?'CERTIFIED RIZZLER 😎':s>60?'Got Rizz 🔥':'No Rizz 💀'}
let caps={Baddie:['not lucky, just worth it 💅','princess treatment only 👑'],Sad:['broken but still pretty 💔','smiling but hurting 🥀'],Savage:['my life, my rules 😈','unbothered 😎'],Soft:['you + me = fav story 💌','soft heart 🤍'],Chill:['good vibes only 🤙','no stress 🌊']};
function genCap(){let m=mood.value.split(' ')[0];let arr=caps[m]||caps.Baddie;capout.value=arr[Math.floor(Math.random()*arr.length)]}
let roasts=['$NAME still uses 2018 memes 💀','$NAME ka rizz WiFi jaisa hai 😂','$NAME snap streak ke alawa kuch maintain nahi karta'];
function genRoast(){let n=roastname.value||'He';let r=roasts[Math.floor(Math.random()*roasts.length)].replace('$NAME',n);roastout.innerText=r}
</script>
</body></html>
