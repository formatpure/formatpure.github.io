<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fake WhatsApp Chat Generator - Prank Your Friends</title>
<div style="background:#fffaeb;border:1px solid #facc15;padding:8px;border-radius:8px;font-size:11px;text-align:center;">
⚠️ This is a FAKE chat maker for fun / prank only. Not affiliated with Instagram or WhatsApp. 
All chats are marked as FAKE.
</div>
  
  <style>
body{margin:0;background:#111b21;font-family:Arial;color:#fff;text-align:center}
header{padding:16px;background:#202c33;color:#fff;font-weight:bold;font-size:20px}
.controls{background:#202c33;padding:12px;border-radius:14px;margin:10px auto;max-width:400px}
input,select,button{width:92%;padding:12px;margin:5px;border-radius:10px;border:none}
button{background:#25D366;color:#000;font-weight:bold;cursor:pointer}
#chatBox{width:95%;max-width:400px;height:550px;margin:10px auto;background:#0b141a;position:relative}
#chatHeader{background:#202c33;color:#fff;padding:10px;display:flex;align-items:center}

#messages{padding:10px;height:430px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;background-image:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}
.msg{max-width:75%;padding:8px 10px;border-radius:8px;font-size:14px;position:relative;color:#000}
.sent{background:#dcf8c6;align-self:flex-end}
.received{background:#fff;align-self:flex-start}
.time{font-size:10px;color:#666;float:right;margin-left:8px;margin-top:4px}
.tick{color:#34B7F1}
</style>
</head>
<body>
<header>💬 Fake WhatsApp Chat - Prank PRO</header>

<div class="controls">
<input id="contactName" placeholder="Contact Name (e.g. Crush 😍)" value="Crush 😍" oninput="updateHeader()">
<input id="status" placeholder="Status (e.g. online, typing...)" value="online" oninput="updateHeader()">
<input type="file" id="avatar" accept="image/*">
<select id="type"><option value="received">Received (White)</option><option value="sent">Sent (Green)</option></select>
<input id="msgText" placeholder="Type message...">
<button onclick="addMsg()">Add Message</button>
<button onclick="clearChat()" style="background:#ff4d6d">Clear Chat</button>
<button onclick="downloadChat()" style="background:#fff;color:#000">📸 Download as Screenshot</button>
<p style="color:#999;font-size:12px">Tip: Add 4-5 messages then download. Looks 100% real!</p>
</div>

<div id="chatBox">
<div id="chatHeader">
<img id="headImg" src="https://i.pravatar.cc/100">
<div><div id="headName" style="font-weight:bold">Crush 😍</div><div id="headStatus" style="font-size:12px;opacity:.8">online</div></div>
</div>
<div id="messages"></div>
</div>

<div style="margin:15px 0;padding:10px;background:#f8fafc;border-radius:8px;">
  <label style="font-size:12px;display:flex;gap:6px;align-items:start;cursor:pointer;">
    <input type="checkbox" id="agree" required style="margin-top:2px;">
    <span>⚠️ I agree this is a <b>FAKE chat for fun/prank only</b>. I will NOT use it to blackmail, harass or defame anyone. I am responsible for my use.</span>
  </label>
  <div style="font-size:11px;margin-top:6px;color:#64748b;">
    Not affiliated with Instagram / WhatsApp. <a href="terms.html" style="color:#38bdf8;">Terms</a>
  </div>
</div>

<button onclick="downloadChat()">Download</button>

<a href="vibelab.html" style="color:#38bdf8;display:block;margin:15px">← Back to VibeLab</a>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
function updateHeader(){
document.getElementById('headName').innerText=document.getElementById('contactName').value||'Crush 😍';
document.getElementById('headStatus').innerText=document.getElementById('status').value||'online';
}
document.getElementById('avatar').onchange=e=>{
let file=e.target.files[0]; if(!file) return;
let r=new FileReader();
r.onload=function(ev){document.getElementById('headImg').src=ev.target.result}; r.readAsDataURL(file);
}
function addMsg(){
let text=document.getElementById('msgText').value;if(!text)return;
let type=document.getElementById('type').value;
let time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
let div=document.createElement('div');div.className='msg '+type;
div.innerHTML=text+`<span class="time">${time} ${type=='sent'?'<span class=tick>✓✓</span>':''}</span>`;
document.getElementById('messages').appendChild(div);
document.getElementById('msgText').value='';document.getElementById('messages').scrollTop=9999;
}
function clearChat(){document.getElementById('messages').innerHTML='';}
function downloadChat(){
  if(!document.getElementById('agree').checked){
    alert("Please tick checkbox - Agree for fun only");
    return;
  }
  html2canvas(document.getElementById('chatBox'), {scale:2}).then(canvas => {
    const ctx = canvas.getContext('2d');
    
    // Footer watermark - 100% safe for 10 years
    ctx.fillStyle = "rgba(0,0,0,0.8)";
    ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
    ctx.fillStyle = "white";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";
    ctx.fillText("FAKE CHAT - FormatPure.github.io - For Fun Only", canvas.width/2, canvas.height - 10);
    
    // Diagonal light watermark
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.font = "bold 26px Arial";
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(-Math.PI/4);
    ctx.fillText("FAKE", 0, 0);
    ctx.restore();

    const link = document.createElement('a');
    link.download = 'fake-chat-formatpure.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.9);
    link.click();
  });
}
</script>
</body>
  </html>
