<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teachers Lab - Certificate, Report Card, Lesson Plan | FormatPure</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
body{background:#020617;color:white;font-family:sans-serif;padding:15px}
input,textarea{width:100%;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white}
button{padding:13px;width:100%;border:none;border-radius:10px;font-weight:bold}
.tab{display:flex;gap:6px}
.tab button{flex:1;font-size:11px}
.active{background:#10b981;color:white}.inactive{background:#1e293b;color:#94a3b8}
.card{background:white;color:black;padding:22px;border-radius:14px;margin-top:15px;display:none;text-align:center}
</style>
</head>
<body>
<h2 style="text-align:center">👨‍🏫 Teachers Lab - Backbone Tool</h2>
<div class="tab">
<button id="t1" class="active" onclick="show(1)">🏆 Certificate</button>
<button id="t2" class="inactive" onclick="show(2)">📊 Report Card</button>
<button id="t3" class="inactive" onclick="show(3)">📝 Lesson Plan</button>
</div>

<!-- CERTIFICATE -->
<div id="box1">
<input id="cTitle" placeholder="Certificate Title: Best Student Award">
<input id="cName" placeholder="Student Name: Ahmed Ali">
<input id="cReason" placeholder="Reason: 1st Position in Class">
<input id="cDate" placeholder="Date: 17 Sept 2026">
<button style="background:#10b981;margin-top:8px" onclick="makeC()">Generate Certificate</button>
<div id="cert" class="card" style="border:6px double #10b981">
<h1 style="color:#10b981;margin:0">🏆 CERTIFICATE</h1>
<h3 id="oCTitle" style="margin:10px 0"></h3>
<p>This certificate is awarded to</p>
<h2 id="oCName" style="color:#0f172a"></h2>
<p id="oCReason"></p>
<p style="font-size:12px;margin-top:20px">Date: <span id="oCDate"></span></p>
<p style="font-size:9px;color:gray">Generated by formatpure.github.io Teachers Lab</p>
</div>
<button id="cDl" style="display:none;background:#10b981;margin-top:10px" onclick="dl('cert','certificate')">Download Certificate</button>
</div>

<!-- REPORT CARD -->
<div id="box2" style="display:none">
<input id="rName" placeholder="Student: Ali Class 9">
<input id="rRoll" placeholder="Roll No: 21">
<input id="rSub1" placeholder="Math Marks: 85/100">
<input id="rSub2" placeholder="Science: 78/100">
<input id="rTotal" placeholder="Total: 350/500">
<button style="background:#0ea5e9;margin-top:8px" onclick="makeR()">Generate Report Card</button>
<div id="report" class="card">
<h3 style="margin:0">📊 REPORT CARD</h3>
<p><b id="oRName"></b> - Roll: <span id="oRRoll"></span></p><hr>
<p id="oRSub1"></p><p id="oRSub2"></p>
<h2 style="color:#0ea5e9">Total: <span id="oRTotal"></span></h2>
<p style="font-size:9px;color:gray">formatpure.github.io</p>
</div>
<button id="rDl" style="display:none;background:#10b981;margin-top:10px" onclick="dl('report','report-card')">Download Report Card</button>
</div>

<!-- LESSON PLAN -->
<div id="box3" style="display:none">
<input id="lSub" placeholder="Subject: Mathematics - Algebra">
<input id="lClass" placeholder="Class: 9th">
<textarea id="lObj" placeholder="Objectives: Students will learn..."></textarea>
<button style="background:#7c3aed;margin-top:8px" onclick="makeL()">Generate Lesson Plan</button>
<div id="lesson" class="card" style="text-align:left">
<h3 style="text-align:center">📝 LESSON PLAN</h3><hr>
<p><b>Subject:</b> <span id="oLSub"></span> | <b>Class:</b> <span id="oLClass"></span></p>
<p><b>Objectives:</b> <span id="oLObj"></span></p>
<p style="font-size:9px;color:gray;text-align:center">Teachers Lab - formatpure.github.io</p>
</div>
<button id="lDl" style="display:none;background:#10b981;margin-top:10px" onclick="dl('lesson','lesson-plan')">Download Lesson Plan</button>
</div>

<script>
function show(n){
  [1,2,3].forEach(i=>{
    document.getElementById('box'+i).style.display=i==n?'block':'none';
    document.getElementById('t'+i).className=i==n?'active':'inactive';
  });
}
function makeC(){
  document.getElementById('cert').style.display='block';document.getElementById('cDl').style.display='block';
  document.getElementById('oCTitle').innerText=document.getElementById('cTitle').value;
  document.getElementById('oCName').innerText=document.getElementById('cName').value;
  document.getElementById('oCReason').innerText=document.getElementById('cReason').value;
  document.getElementById('oCDate').innerText=document.getElementById('cDate').value;
}
function makeR(){
  document.getElementById('report').style.display='block';document.getElementById('rDl').style.display='block';
  document.getElementById('oRName').innerText=document.getElementById('rName').value;
  document.getElementById('oRRoll').innerText=document.getElementById('rRoll').value;
  document.getElementById('oRSub1').innerText=document.getElementById('rSub1').value;
  document.getElementById('oRSub2').innerText=document.getElementById('rSub2').value;
  document.getElementById('oRTotal').innerText=document.getElementById('rTotal').value;
}
function makeL(){
  document.getElementById('lesson').style.display='block';document.getElementById('lDl').style.display='block';
  document.getElementById('oLSub').innerText=document.getElementById('lSub').value;
  document.getElementById('oLClass').innerText=document.getElementById('lClass').value;
  document.getElementById('oLObj').innerText=document.getElementById('lObj').value;
}
function dl(id,name){
  html2canvas(document.getElementById(id)).then(c=>{
    let a=document.createElement('a');a.download=name+'.png';a.href=c.toDataURL();a.click();
  });
}
</script>
</body>
</html>
