<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDENTS LAB ULTRA PRO</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a1a;color:#fff;margin:0;padding:20px}
.container{max-width:900px;margin:auto}
h1{text-align:center;letter-spacing:2px}
.sub{text-align:center;color:#aaa;margin-bottom:20px}
textarea{width:100%;height:180px;background:#111;color:#fff;border:1px solid #444;border-radius:10px;padding:12px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
select,input,button{padding:12px;border-radius:8px;border:none}
button{background:#7c3aed;color:#fff;font-weight:bold;cursor:pointer;flex:1}
button:hover{background:#6d28d9}
.section{background:#151528;padding:15px;border-radius:10px;margin-top:20px}
.mcq{margin-bottom:12px;padding:10px;background:#1e1e36;border-radius:8px}
.correct{color:#4ade80}
.timer{font-size:24px;text-align:center;color:#facc15}
@media print{.no-print{display:none}}
</style>
</head>
<body>
<div class="container">
<h1>STUDENTS LAB ULTRA PRO</h1>
<div class="sub">1000 Words • 300 MCQs • Full Timetable • All Downloads</div>

<textarea id="inputText" placeholder="Paste your chapter (min 100 words)..." oninput="countWords()"></textarea>
<div id="wc">0 words</div>

<div class="controls no-print">
<select id="mcqCount">
<option value="50">50 MCQs - Quick</option>
<option value="100">100 MCQs - Standard</option>
<option value="300" selected>300 MCQs - ULTRA</option>
</select>
<label>Time (min): <input type="number" id="timeSet" value="60" min="5" max="300" style="width:70px"></label>
<select id="sumLen">
<option value="short">Summary: 10 Lines</option>
<option value="long">Summary: 500-1000 words Detailed</option>
</select>
</div>

<button class="no-print" onclick="generateLab()">GENERATE FULL LAB →</button>
<button class="no-print" onclick="fillSample()">Try Sample Chapter</button>

<div id="output"></div>
</div>

<script>
function countWords(){
  let t=document.getElementById('inputText').value.trim();
  let c=t? t.split(/\s+/).length:0;
  document.getElementById('wc').innerText=c+" words";
}
function fillSample(){
  document.getElementById('inputText').value="Cell is the basic unit of life. Robert Hooke discovered cell in 1665. Prokaryotic cells lack nucleus like bacteria. Eukaryotic cells have nucleus like plants and animals. Mitochondria produces ATP energy. Ribosomes synthesize proteins. Nucleus contains DNA and controls cell. Plant cells have cell wall, chloroplasts and large vacuole. Animal cells have small vacuoles. Cells divide by mitosis for growth and meiosis for gametes.";
  countWords();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function generateLab(){
  let text=document.getElementById('inputText').value.trim();
  if(text.split(/\s+/).length<20){alert("Paste at least 20 words for test");return}
  let sentences=text.match(/[^.!?]+[.!?]+/g)||[text];
  let mcqN=parseInt(document.getElementById('mcqCount').value);
  let timeM=parseInt(document.getElementById('timeSet').value);
  let out=document.getElementById('output');

  // Extract keywords
  let words=text.split(/\s+/).filter(w=>w.length>5);
  let uniq=[...new Set(words)].slice(0,100);

  let mcqs=[], seen=new Set();
  let i=0, attempts=0;
  while(mcqs.length<mcqN && attempts<mcqN*5){
    attempts++;
    let s=sentences[Math.floor(Math.random()*sentences.length)].trim();
    if(seen.has(s) || s.length<20) continue;
    seen.add(s);
    let keyword=uniq[Math.floor(Math.random()*uniq.length)]||"cell";
    let q=`Q${mcqs.length+1}: Which statement is correct about "${keyword}" based on the chapter?`;
    let correct=`As described: ${s.substring(0,80)}...`;
    let distractors=[`It is unrelated to ${keyword} in this chapter`,`It contradicts the given explanation`,`It is not mentioned in the text`];
    let opts=shuffle([correct,...distractors]);
    let ansIdx=opts.indexOf(correct);
    let letters=['A','B','C','D'];
    mcqs.push({q,opts,ans:letters[ansIdx],exp:`Correct because text states: "${s.substring(0,60)}..."`});
    i++;
  }

  // Build HTML
  let h=`<div class="section"><div class="timer no-print">⏱ Time Set: ${timeM} minutes - <button onclick="startTimer(${timeM*60})">Start Test</button> <span id="t"></span></div></div>`;

  // Summary
  let sumType=document.getElementById('sumLen').value;
  let summary = sumType==='short'? sentences.slice(0,10).join(' ') : text.substring(0,4000)+"<br><br><b>Key Points:</b><ul><li>"+sentences.slice(0,15).join('</li><li>')+"</li></ul>";
  h+=`<div class="section"><h2>📝 Summary</h2><p>${summary}</p></div>`;

  // MCQs Questions Only
  h+=`<div class="section"><h2>❓ MCQs - Questions Only (${mcqs.length})</h2>`;
  mcqs.forEach((m,idx)=>{
    h+=`<div class="mcq"><b>${m.q}</b><br>`+m.opts.map((o,j)=>`${['A','B','C','D'][j]}. ${o}`).join('<br>')+`</div>`;
  });
  h+=`</div>`;

  // Answer Key Separate
  h+=`<div class="section"><h2>🔑 Answer Key (Separate)</h2>`;
  mcqs.forEach((m,idx)=>{h+=`<div>Q${idx+1}: <span class="correct">${m.ans}</span> - ${m.exp}</div>`});
  h+=`</div>`;

  // Short Q/A
  h+=`<div class="section"><h2>✍️ Short Q/A (20)</h2><ol>`;
  for(let k=0;k<20;k++){let s=sentences[k%sentences.length];h+=`<li>What is meant by: "${s.substring(0,50)}..."?<br><b>Ans:</b> ${s}</li>`}
  h+=`</ol></div>`;

  // Long Q/A
  h+=`<div class="section"><h2>📖 Long Q/A (10)</h2><ol>`;
  for(let k=0;k<10;k++){let s=sentences[k%sentences.length];h+=`<li>Explain in detail: "${s.substring(0,60)}..."?<br><b>Detailed Ans:</b> ${s} ${sentences[(k+1)%sentences.length]||''}</li>`}
  h+=`</ol></div>`;

  // Extra features
  h+=`<div class="section"><h2>🧠 Flashcards</h2><p>${uniq.slice(0,20).map(w=>`<button onclick="alert('${w}')">${w}</button>`).join(' ')}</p></div>`;
  h+=`<div class="section"><h2>✅ True/False (20)</h2><ol>`;
  for(let k=0;k<20;k++){h+=`<li>${sentences[k%sentences.length]} (True/False)</li>`}
  h+=`</ol></div>`;
  h+=`<div class="section"><h2>🔲 Fill in the Blanks (20)</h2><ol>`;
  for(let k=0;k<20;k++){let w=uniq[k%uniq.length];h+=`<li>_______ ${sentences[k%sentences.length].substring(20)}</li>`}
  h+=`</ol></div>`;

  h+=`<div class="section no-print"><button onclick="window.print()">📥 Download as PDF / Print</button>
  <button onclick="localStorage.setItem('lab','saved');alert('Progress saved!')">💾 Save Progress</button></div>`;

  out.innerHTML=h;
  window.scrollTo(0,document.body.scrollHeight);
}

let timerInt;
function startTimer(sec){
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    let m=Math.floor(sec/60), s=sec%60;
    document.getElementById('t').innerText=`${m}:${s<10?'0':''}${s}`;
    if(sec<=0)clearInterval(timerInt);
    sec--;
  },1000);
}
</script>
</body>
</html>
