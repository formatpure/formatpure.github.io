<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>STUDENTS LAB</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{background:#08081a;color:#fff;margin:0;padding:15px}
.container{max-width:1000px;margin:auto}h1{text-align:center}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.tab{padding:10px 15px;background:#222;border-radius:20px;cursor:pointer}
.tab.active{background:#7c3aed}
.panel{display:none;background:#12122a;padding:20px;border-radius:12px;margin-top:10px}
.panel.active{display:block}
textarea{width:100%;height:150px;background:#000;color:#fff;border:1px solid #444;border-radius:8px;padding:10px}
button{background:#7c3aed;color:#fff;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;margin:5px}
input,select{padding:10px;border-radius:6px;border:none;margin:5px}
.mcq{background:#1e1e3a;padding:10px;margin:8px 0;border-radius:8px}
</style></head><body><div class="container">
<h1>🎓 STUDENTS LAB</h1>
<p style="text-align:center;color:#aaa">Paste chapter text once → use all tools</p>
<textarea id="mainText" placeholder="Paste chapter text here..."></textarea>

<div class="tabs">
<div class="tab active" onclick="showTab('summary',event)">📝 Summary</div>
<div class="tab" onclick="showTab('timetable',event)">📅 Time Table</div>
<div class="tab" onclick="showTab('timer',event)">⏱ Timer</div>
<div class="tab" onclick="showTab('mcqs',event)">❓ MCQs</div>
<div class="tab" onclick="showTab('short',event)">✍️ Short Q/A</div>
<div class="tab" onclick="showTab('long',event)">📖 Long Q/A</div>
<div class="tab" onclick="showTab('downloads',event)">📥 Downloads</div>
</div>

<div id="summary" class="panel active"><h2>Summary</h2><select id="sumType"><option>10 Lines Quick</option><option>Detailed</option></select> <button onclick="genSummary()">Generate</button><div id="sumOut"></div></div>
<div id="timetable" class="panel"><h2>Time Table</h2><input id="subs" placeholder="Bio, Chem, Phy"><button onclick="genTT()">Create</button><div id="ttOut"></div></div>
<div id="timer" class="panel"><h2>Timer</h2><input type="number" id="tmin" value="60" style="width:80px"> min <button onclick="startT()">Start</button><h1 id="tdisp">60:00</h1></div>
<div id="mcqs" class="panel"><h2>MCQs</h2><select id="mcqN"><option>50</option><option>100</option><option>300</option><option>500</option></select> <button onclick="genMCQ()">Generate</button><div id="mcqOut"></div><div id="mcqKey"></div></div>
<div id="short" class="panel"><h2>Short Q/A (100)</h2><button onclick="genQA('short')">Generate</button><div id="shortOut"></div></div>
<div id="long" class="panel"><h2>Long Q/A (50)</h2><button onclick="genQA('long')">Generate</button><div id="longOut"></div></div>
<div id="downloads" class="panel"><h2>Downloads</h2><button onclick="window.print()">📄 Save as PDF</button></div>
</div>

<script>
function showTab(id,e){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));e.target.classList.add('active');document.getElementById(id).classList.add('active')}
function getSent(){let t=document.getElementById('mainText').value;return t.match(/[^.!?]+[.!?]+/g)||[t||"No text pasted."]}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function genSummary(){let s=getSent();document.getElementById('sumOut').innerHTML="<p>"+s.slice(0,20).join(' ')+"</p>"}
function genTT(){let subs=document.getElementById('subs').value.split(',');let h="<table border=1 cellpadding=8><tr><th>Day</th>"+subs.map(s=>`<th>${s}</th>`).join('')+"</tr>";for(let d=1;d<=7;d++){h+=`<tr><td>Day ${d}</td>`+subs.map(()=>`<td>Study</td>`).join('')+"</tr>"}document.getElementById('ttOut').innerHTML=h+"</table>"}
let ti;function startT(){let sec=(+document.getElementById('tmin').value)*60;clearInterval(ti);ti=setInterval(()=>{document.getElementById('tdisp').innerText=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;if(sec--<=0)clearInterval(ti)},1000)}
function genMCQ(){let n=+document.getElementById('mcqN').value;let sents=getSent();let seen=new Set();let out="",key="<h3>Answer Key</h3>";let c=0,a=0;while(c<n&&a<n*5){a++;let s=sents[Math.floor(Math.random()*sents.length)];if(!s||seen.has(s)||s.length<15)continue;seen.add(s);c++;let corr=s.trim().substring(0,70)+"...";let opts=shuffle([corr,"Not supported","Contradicts concept","Irrelevant"]);let ans=['A','B','C','D'][opts.indexOf(corr)];out+=`<div class="mcq"><b>Q${c}.</b> ${opts.map((o,i)=>['A','B','C','D'][i]+". "+o).join('<br>')}</div>`;key+=`Q${c}: <b>${ans}</b><br>`}document.getElementById('mcqOut').innerHTML=out;document.getElementById('mcqKey').innerHTML=key}
function genQA(t){let s=getSent();let n=t==='short'?100:50;let h="<ol>";for(let i=0;i<n;i++){let s1=s[i%s.length]||"";h+=`<li><b>Q:</b> ${s1.substring(0,60)}...<br><b>A:</b> ${s1}</li>`}document.getElementById(t+'Out').innerHTML=h+"</ol>"}
</script></body></html>
