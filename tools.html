<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FormatPure 200 Pro</title>
<style>body{font-family:system-ui;margin:0;background:#f6f7fb}header{background:#111;color:#fff;padding:16px;text-align:center}nav{display:flex;gap:8px;overflow:auto;padding:10px;background:#fff;position:sticky;top:0}.f{padding:8px 14px;border:1px solid #ddd;border-radius:20px;background:#eee;white-space:nowrap;cursor:pointer}.f.on{background:#111;color:#fff}#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;padding:12px}.t{background:#fff;padding:14px;border-radius:12px;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.07);cursor:pointer}#v{display:none;background:#fff;margin:10px;padding:15px;border-radius:12px}input,textarea{width:94%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}button{padding:10px 14px;background:#111;color:#fff;border:0;border-radius:8px;margin:4px}</style></head><body>
<header><h2>⚡ FormatPure 200 Pro</h2><div id="streak"></div></header>
<nav id="n"></nav><div id="g"></div><div id="v"><button onclick="goBack()">← Back</button><h3 id="vt"></h3><div id="vb"></div></div>
<script>
let s=localStorage.getItem('fp_s')||0, l=localStorage.getItem('fp_l'), t=new Date().toDateString();if(l!==t){s=l?parseInt(s)+1:1;localStorage.setItem('fp_s',s);localStorage.setItem('fp_l',t)}document.getElementById('streak').innerText='🔥 '+s+' day streak';
const C=["Students","Teachers","Doctors","Home","Office"];
// name|cat|type : types = counter, gpa, emi, bmi, pass, timer, todo, text, calc, age, qr
const D=[
"Word Counter|Students|counter","GPA Calculator|Students|gpa","Attendance %|Students|calc","Sci Calculator|Students|calc2","Syllabus Tracker|Students|todo","Random Picker|Students|random","Essay Counter|Students|counter","Citation Generator|Students|text","Dictionary|Students|dict","Exam Countdown|Students|timer",
"Voice Notes|Students|todo","Percent Calc|Students|calc2","BMI Calc|Students|bmi","Date Diff|Students|age","Password Gen|Students|pass","Text to Speech|Students|text","QR Maker|Students|text","Mind Map|Students|todo","Timetable Maker|Students|todo","Pomodoro|Students|timer","MCQ Maker|Students|text","Short QA|Students|text","Long QA|Students|text","Summarizer|Students|counter","Pass Fail|Students|gpa","Flashcards|Students|todo","Unit Converter|Students|calc2","Age Calc|Students|age","Notes|Students|todo","Todo|Students|todo","Grammar Fix|Students|text","Presentation Timer|Students|timer","Book Manager|Students|todo","Cover Maker|Students|text","Result Predictor|Students|calc2","Fee Calc|Students|calc2","CV Maker|Students|text","Plagiarism Basic|Students|counter","Study Planner|Students|todo","Formula Solver|Students|calc2",
"Lesson Plan|Teachers|text","Marks Calc|Teachers|calc2","Gradebook|Teachers|todo","Seating Plan|Teachers|random","Quiz Timer|Teachers|timer","Rubric Maker|Teachers|text","Attendance Sheet|Teachers|todo","Report Comments|Teachers|text","Parent Message|Teachers|text","Timetable|Teachers|todo","Paper Formatter|Teachers|text","Answer Checker|Teachers|text","Syllabus Splitter|Teachers|text","Homework Tracker|Teachers|todo","Picker Wheel|Teachers|random","Noise Meter|Teachers|timer","Group Divider|Teachers|random","Certificate|Teachers|text","ID Card|Teachers|text","Fee List|Teachers|todo","Salary Slip|Teachers|text","Leave App|Teachers|text","Meeting Minutes|Teachers|text","Kids Dict|Teachers|dict","Story Gen|Teachers|text","Worksheet Gen|Teachers|text","Math Gen|Teachers|random","Spelling Test|Teachers|random","Reading Timer|Teachers|timer","Class Poll|Teachers|todo","Whiteboard|Teachers|todo","Assignment Check|Teachers|todo","PT Scheduler|Teachers|text","Discipline Log|Teachers|todo","Library|Teachers|todo","Exam Planner|Teachers|timer","Substitution|Teachers|todo","Performance Graph|Teachers|text","Daily Diary|Teachers|todo","Question Bank|Teachers|text",
"BMI Adv|Doctors|bmi","BMR Calc|Doctors|calc2","Due Date|Doctors|age","Medicine Reminder|Doctors|todo","Dosage Calc|Doctors|calc2","Water Tracker|Doctors|todo","Sleep Calc|Doctors|calc2","Heart Zones|Doctors|calc2","BP Log|Doctors|todo","Diabetes Risk|Doctors|text","Appointment Slip|Doctors|text","Prescription|Doctors|text","Token System|Doctors|random","Shift Planner|Doctors|todo","Duty Roster|Doctors|todo","Salary Duty|Doctors|calc2","Leave Counter|Doctors|calc2","Medical Leave|Doctors|text","Patient History|Doctors|text","Consent Form|Doctors|text","Diet Chart|Doctors|text","Calorie Counter|Doctors|calc2","Steps Km|Doctors|calc2","Fever Chart|Doctors|todo","Vaccine Tracker|Doctors|todo","Baby Growth|Doctors|text","Period Tracker|Doctors|age","Pregnancy Week|Doctors|age","First Aid|Doctors|text","Symptom Notes|Doctors|todo","Clinic Fee|Doctors|calc2","Queue Display|Doctors|todo","Medical Dict|Doctors|dict","Lab Format|Doctors|text","Injection Remind|Doctors|todo","OPD Token|Doctors|random","Followup|Doctors|todo","Clinic Expense|Doctors|calc2","Scheduler|Doctors|todo","Health Tip|Doctors|random",
"Grocery List|Home|todo","Budget Planner|Home|calc2","Expense Splitter|Home|calc2","Rent Receipt|Home|text","Electricity Est|Home|emi","Water Split|Home|calc2","Gas Log|Home|todo","Recipe Scaler|Home|calc2","Cooking Timer|Home|timer","Kitchen Convert|Home|calc2","Salary Daily|Home|calc2","Savings Goal|Home|calc2","Loan EMI|Home|emi","Gold Calc|Home|calc2","Currency Man|Home|calc2","Discount Calc|Home|calc2","Tailor Save|Home|todo","Cleaning List|Home|todo","Maintenance|Home|todo","Fee Tracker|Home|todo","Prayer Notes|Home|todo","Kitchen Stock|Home|todo","Expiry Alert|Home|todo","Warranty|Home|todo","Rent Agreement|Home|text","Complaint Letter|Home|text","Parcel Notes|Home|todo","Recharge Plan|Home|calc2","Data Calc|Home|calc2","Packing List|Home|todo","Fuel Cost|Home|calc2","Paint Est|Home|calc2","Furniture Plan|Home|calc2","Load Calc|Home|calc2","Water Need|Home|bmi","Family Tree|Home|text","Birthday Remind|Home|todo","Wedding Budget|Home|emi","Task Assigner|Home|random","Expense Diary|Home|todo",
"Invoice|Office|text","Quotation|Office|text","Salary Slip Pro|Office|text","Resignation|Office|text","Offer Letter|Office|text","Agenda|Office|text","Minutes Pro|Office|text","Deadline Tracker|Office|todo","Task Report|Office|text","Attendance Reg|Office|todo","Overtime Calc|Office|calc2","Tax Calc|Office|calc2","Profit Margin|Office|calc2","Discount Biz|Office|calc2","Loan EMI Biz|Office|emi","Currency Inv|Office|calc2","Followup|Office|todo","Business Card|Office|text","Logo Text|Office|text","Email Writer|Office|text","Complaint Solve|Office|text","Interview Qs|Office|text","Employee ID|Office|text","Shift Schedule|Office|todo","Target Tracker|Office|todo","Commission Calc|Office|calc2","Stock Reg|Office|todo","Barcode|Office|text","QR Card|Office|text","Resume Pro|Office|text","Cover Letter|Office|text","LinkedIn Bio|Office|text","Freelance Rate|Office|calc2","Timezone Plan|Office|text","Work Hours|Office|calc2","Break Reminder|Office|timer","Promotion Letter|Office|text","Feedback Form|Office|text","Profit Loss|Office|calc2","Client Invoice|Office|text"
];
let cur="Students";
function renderN(){document.getElementById('n').innerHTML=C.map(c=>`<div class="f ${c==cur?'on':''}" onclick="setC('${c}')">${c}</div>`).join('')}
function setC(c){cur=c;renderN();renderG()}
function renderG(){document.getElementById('g').style.display='grid';document.getElementById('v').style.display='none';let f=D.filter(x=>x.split('|')[1]==cur);document.getElementById('g').innerHTML=f.map(x=>{let a=x.split('|');return `<div class="t" onclick="openT('${a[0]}','${a[2]}')">🛠️<br>${a[0]}</div>`}).join('')}
function goBack(){renderG()}
function openT(n,ty){document.getElementById('g').style.display='none';document.getElementById('v').style.display='block';document.getElementById('vt').innerText=n;let b=document.getElementById('vb');
if(ty=='counter')b.innerHTML=`<textarea id="a" rows="5" placeholder="Paste text"></textarea><button onclick="dCounter()">Count</button><div id="o"></div>`;
else if(ty=='bmi')b.innerHTML=`<input id="h" type="number" placeholder="Height cm"><input id="w" type="number" placeholder="Weight kg"><button onclick="dBmi()">Calculate BMI</button><div id="o"></div>`;
else if(ty=='emi')b.innerHTML=`<input id="p" type="number" placeholder="Amount"><input id="r" type="number" placeholder="Rate % yearly"><input id="n" type="number" placeholder="Months"><button onclick="dEmi()">EMI</button><div id="o"></div>`;
else if(ty=='gpa')b.innerHTML=`<input id="a" placeholder="Marks obtained, comma separated e.g 80,90,75"><button onclick="dGpa()">GPA</button><div id="o"></div>`;
else if(ty=='pass')b.innerHTML=`<button onclick="dPass()">Generate</button><div id="o"></div>`;
else if(ty=='calc2')b.innerHTML=`<input id="a" type="number" placeholder="Value 1"><input id="b" type="number" placeholder="Value 2"><button onclick="dCalc()">=</button><div id="o"></div>`;
else if(ty=='timer')b.innerHTML=`<input id="a" type="number" placeholder="Seconds"><button onclick="dTimer()">Start</button><div id="o"></div>`;
else if(ty=='todo')b.innerHTML=`<input id="a" placeholder="Add"><button onclick="dTodo('${n}')">Add</button><ul id="o"></ul>`;
else if(ty=='random')b.innerHTML=`<input id="a" placeholder="Names comma separated"><button onclick="dRand()">Pick</button><div id="o"></div>`;
else if(ty=='age')b.innerHTML=`<input id="a" type="date"><button onclick="dAge()">Calculate</button><div id="o"></div>`;
else b.innerHTML=`<textarea id="a" rows="5" placeholder="Input for ${n}"></textarea><button onclick="dText('${n}')">Generate</button><button onclick="localStorage.setItem('fp_${n}',document.getElementById('a').value);alert('Saved')">Save</button><div id="o"></div>`;
}
function dCounter(){let v=document.getElementById('a').value;let w=v.trim().split(/\s+/).filter(x=>x).length;document.getElementById('o').innerHTML=`Words: ${w}<br>Chars: ${v.length}<br>Reading: ${Math.ceil(w/200)} min`}
function dBmi(){let h=document.getElementById('h').value/100,w=document.getElementById('w').value;let b=(w/(h*h)).toFixed(1);document.getElementById('o').innerHTML=`BMI: ${b}`}
function dEmi(){let p=+document.getElementById('p').value,r=+document.getElementById('r').value/1200,n=+document.getElementById('n').value;let e=p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);document.getElementById('o').innerHTML=`Monthly EMI: ${e.toFixed(0)}`}
function dGpa(){
  let v=document.getElementById('a').value;
  if(v.includes('/')){
    let parts=v.split('/');
    let avg=(parseFloat(parts[0])/parseFloat(parts[1])*100);
    document.getElementById('o').innerHTML=`Percentage: ${avg.toFixed(1)}% Grade: ${avg>=90?'A+':avg>=80?'A':avg>=70?'B':'C'}`;
  } else {
    let a=v.split(',').map(x=>+x);let avg=a.reduce((x,y)=>x+y,0)/a.length;
    document.getElementById('o').innerHTML=`Average: ${avg.toFixed(1)}% Grade: ${avg>=90?'A+':avg>=80?'A':avg>=70?'B':'C'}`;
  }
}
function dPass(){let c="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz123456789!@#";let p="";for(let i=0;i<12;i++)p+=c[Math.floor(Math.random()*c.length)];document.getElementById('o').innerHTML=`<b>${p}</b>`}
function dCalc(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value;document.getElementById('o').innerHTML=`Add: ${a+b}<br>Sub: ${a-b}<br>Mul: ${a*b}<br>Div: ${b? (a/b).toFixed(2):0}`}
function dTimer(){let s=+document.getElementById('a').value;let o=document.getElementById('o');let i=setInterval(()=>{o.innerHTML=s+' sec';s--;if(s<0){clearInterval(i);o.innerHTML='Done!'}},1000)}
function dTodo(n){let v=document.getElementById('a').value;let k='todo_'+n;let arr=JSON.parse(localStorage.getItem(k)||'[]');arr.push(v);localStorage.setItem(k,JSON.stringify(arr));let o=document.getElementById('o');o.innerHTML=arr.map(x=>`<li>${x}</li>`).join('')}
function dRand(){let a=document.getElementById('a').value.split(',');document.getElementById('o').innerHTML=`Winner: <b>${a[Math.floor(Math.random()*a.length)]}</b>`}
function dAge(){let d=new Date(document.getElementById('a').value);let diff=Date.now()-d.getTime();let age=new Date(diff).getUTCFullYear()-1970;document.getElementById('o').innerHTML=`Age: ${age} years`}
function dText(n){let v=document.getElementById('a').value;document.getElementById('o').innerHTML=`<b>${n} ready:</b><br>${v.substring(0,200)}...<br><br>Copied format for offline use ✓`}
renderN();renderG();
</script></body></html>
