<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meme Generator</title>
<style>body{background:#0f172a;color:#fff;font-family:Arial;padding:20px;text-align:center}input,button{padding:14px;margin:8px;width:90%;max-width:400px;border-radius:10px;border:1px solid #334155}input{background:#1e293b;color:#fff}button{background:#22c55e;font-weight:bold;border:none;cursor:pointer}canvas{max-width:95%;margin-top:15px;border-radius:10px}</style>
</head><body>
<h2 style="color:#38bdf8">😂 Meme Generator</h2>
<p style="color:#94a3b8">Upload → Add Text → Download</p>
<input type="file" id="file" accept="image/*"><br>
<input id="top" placeholder="TOP TEXT" oninput="draw()"><br>
<input id="bot" placeholder="BOTTOM TEXT" oninput="draw()"><br>
<canvas id="c"></canvas><br>
<button onclick="dl()">⬇ Download Meme</button><br><br>
<a href="index.html" style="color:#38bdf8">← Back</a>
<script>
let img=new Image();
file.onchange=e=>{let r=new FileReader();r.onload=v=>{img.onload=draw;img.src=v.target.result};r.readAsDataURL(e.target.files[0])};
function draw(){if(!img.src)return;let c=document.getElementById('c'),x=c.getContext('2d');c.width=img.width>600?600:img.width;c.height=c.width*img.height/img.width;x.drawImage(img,0,0,c.width,c.height);x.font='bold 36px Impact';x.textAlign='center';x.fillStyle='white';x.strokeStyle='black';x.lineWidth=6;let t=top.value.toUpperCase(),b=bot.value.toUpperCase();if(t){x.strokeText(t,c.width/2,45);x.fillText(t,c.width/2,45)}if(b){x.strokeText(b,c.width/2,c.height-20);x.fillText(b,c.width/2,c.height-20)}}
function dl(){let a=document.createElement('a');a.download='meme.png';a.href=document.getElementById('c').toDataURL();a.click()}
</script></body></html>
