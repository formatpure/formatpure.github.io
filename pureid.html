<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PureID - Free Passport Photo Maker</title>
<style>
body{margin:0;background:#070710;color:#fff;font-family:Arial;text-align:center}
header{padding:14px;background:linear-gradient(90deg,#00ff88,#00d4ff);color:#000;font-weight:900;font-size:18px}
.badge{display:inline-block;background:#000;color:#00ff88;padding:4px 10px;border-radius:20px;font-size:10px;margin-top:6px;border:1px solid #00ff88}
.box{background:#151525;padding:14px;border-radius:16px;margin:12px auto;max-width:460px;border:1px solid #2a2a4a}
.upload{border:2px dashed #00ff88;border-radius:14px;padding:20px;margin:10px 0;cursor:pointer;background:#0a0a18;font-weight:bold}
input[type=file]{display:none}
button{width:94%;padding:13px;margin:6px;border-radius:12px;border:none;font-weight:900;font-size:13px;cursor:pointer}
.btn-green{background:linear-gradient(90deg,#00ff88,#00d4ff);color:#000}
.btn-dark{background:#222;color:#fff;border:1px solid #444}
canvas{background:#fff;border-radius:10px;width:100%;max-width:340px;border:2px solid #333;display:block;margin:auto}
.controls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.controls button{width:22%;font-size:11px;padding:10px}
.slider{width:90%;margin:6px 0}
.small{font-size:11px;color:#aaa}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{padding:10px;background:#222;border-radius:10px;font-size:12px;border:1px solid #333;cursor:pointer}
.opt.active{background:#00ff88;color:#000;font-weight:900}
</style>
</head><body>
<header>🪪 PUREID - PASSPORT PHOTO LAB<div style="font-size:11px">Save 300 Rs - 100% FREE FOREVER</div><div class="badge">WORKS OFFLINE - NO WATERMARK</div></header>

<div class="box">
<h3>1. Upload Your Photo</h3>
<p class="small">Front face is best</p>
<div class="upload" id="upBtn">📁 Click to Upload Photo<br><span style="font-size:10px;color:#888">Gallery / Camera</span></div>
<input type="file" id="fileInput" accept="image/*">

<canvas id="cropCanvas" width="413" height="531"></canvas>
<p class="small">👆 Passport Size (35x45mm)</p>

<label class="small">Zoom: <span id="zoomVal">100</span>%</label><br>
<input type="range" id="zoomSlider" min="50" max="250" value="100" class="slider">
<div class="controls">
<button class="btn-dark" id="bUp">⬆️</button>
<button class="btn-dark" id="bDown">⬇️</button>
<button class="btn-dark" id="bLeft">⬅️</button>
<button class="btn-dark" id="bRight">➡️</button>
</div>

<label style="display:block;margin:12px 0;background:#222;padding:12px;border-radius:10px;font-size:12px;border:1px solid #00ff88">
<input type="checkbox" id="shirtToggle" checked> 👔 Add Formal White Shirt + Tie
</label>

<h3>3. Print Sheet</h3>
<div class="grid">
<div class="opt active" id="s12">12 Photos</div>
<div class="opt" id="s8">8 Photos</div>
<div class="opt" id="s20">20 Photos</div>
<div class="opt" id="s1">1 Photo</div>
</div>

<button class="btn-green" id="makeSheetBtn">🖨️ MAKE A4 PRINT SHEET</button>
<button class="btn-dark" id="downSingleBtn">📥 Download Single</button>

<canvas id="sheetCanvas" width="1240" height="1754" style="max-width:100%;background:#fff;margin-top:10px"></canvas>
<br>
<button class="btn-green" id="downSheetBtn">📥 Download A4 Sheet</button>
</div>

<script>
let img=null, offsetX=0, offsetY=0, sheetCount=12, showGuide=true;
const cropC=document.getElementById('cropCanvas'), ctx=cropC.getContext('2d');
const sheetC=document.getElementById('sheetCanvas'), sctx=sheetC.getContext('2d');
const fileInput=document.getElementById('fileInput');

// INIT WHITE
ctx.fillStyle='#fff'; ctx.fillRect(0,0,cropC.width,cropC.height);
sctx.fillStyle='#fff'; sctx.fillRect(0,0,sheetC.width,sheetC.height);

// Upload button
document.getElementById('upBtn').onclick=()=>fileInput.click();

fileInput.onchange=(e)=>{
 let f=e.target.files[0]; if(!f)return;
 let url=URL.createObjectURL(f);
 let i=new Image();
 i.onload=()=>{
   img=i;
   offsetX=0; offsetY=0;
   document.getElementById('zoomSlider').value=100;
   document.getElementById('zoomVal').innerText=100;
   drawCrop();
 };
 i.src=url;
};

function drawCrop(){
 if(!img){ctx.fillStyle='#fff'; ctx.fillRect(0,0,cropC.width,cropC.height); return;}
 let zoom=parseInt(document.getElementById('zoomSlider').value)/100;
 let base=Math.max(cropC.width/img.width, cropC.height/img.height);
 let s=base*zoom;
 let w=img.width*s, h=img.height*s;
 let x=(cropC.width-w)/2+offsetX, y=(cropC.height-h)/2+offsetY;
 ctx.fillStyle='#fff'; ctx.fillRect(0,0,cropC.width,cropC.height);
 ctx.drawImage(img,x,y,w,h);
 if(document.getElementById('shirtToggle').checked){
   ctx.fillStyle='#fff'; ctx.fillRect(cropC.width*0.12, cropC.height*0.65, cropC.width*0.76, cropC.height*0.35);
   ctx.fillStyle='#111'; ctx.fillRect(cropC.width*0.43, cropC.height*0.68, cropC.width*0.14, cropC.height*0.28);
   ctx.fillStyle='#e8e8e8';
   ctx.beginPath(); ctx.moveTo(cropC.width*0.28, cropC.height*0.68); ctx.lineTo(cropC.width*0.43, cropC.height*0.68); ctx.lineTo(cropC.width*0.37, cropC.height*0.82); ctx.fill();
   ctx.beginPath(); ctx.moveTo(cropC.width*0.72, cropC.height*0.68); ctx.lineTo(cropC.width*0.57, cropC.height*0.68); ctx.lineTo(cropC.width*0.63, cropC.height*0.82); ctx.fill();
 }
 if(showGuide){
   ctx.strokeStyle='rgba(0,255,136,0.4)'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
   ctx.beginPath(); ctx.ellipse(cropC.width/2, cropC.height/2.15, cropC.width*0.30, cropC.height*0.30, 0,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
 }
}

document.getElementById('zoomSlider').oninput=(e)=>{document.getElementById('zoomVal').innerText=e.target.value; drawCrop();}
document.getElementById('bUp').onclick=()=>{offsetY-=15; drawCrop();}
document.getElementById('bDown').onclick=()=>{offsetY+=15; drawCrop();}
document.getElementById('bLeft').onclick=()=>{offsetX-=15; drawCrop();}
document.getElementById('bRight').onclick=()=>{offsetX+=15; drawCrop();}
document.getElementById('shirtToggle').onchange=drawCrop;

document.getElementById('s12').onclick=function(){sheetCount=12; setActive(this);}
document.getElementById('s8').onclick=function(){sheetCount=8; setActive(this);}
document.getElementById('s20').onclick=function(){sheetCount=20; setActive(this);}
document.getElementById('s1').onclick=function(){sheetCount=1; setActive(this);}
function setActive(el){document.querySelectorAll('.opt').forEach(o=>o.classList.remove('active')); el.classList.add('active');}

document.getElementById('makeSheetBtn').onclick=()=>{
 if(!img){alert('Upload photo first'); return;}
 showGuide=false; drawCrop();
 sctx.fillStyle='#fff'; sctx.fillRect(0,0,sheetC.width,sheetC.height);
 let cols=3,rows=4; if(sheetCount==1){cols=1;rows=1} else if(sheetCount==8){cols=2;rows=4} else if(sheetCount==20){cols=4;rows=5}
 let pw=300, ph=Math.floor(pw*531/413), gap=18;
 let sx=(sheetC.width-(cols*pw+(cols-1)*gap))/2, sy=30;
 let tmp=document.createElement('canvas'); tmp.width=413; tmp.height=531; tmp.getContext('2d').drawImage(cropC,0,0);
 for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){if(r*cols+c>=sheetCount)break;
   let x=sx+c*(pw+gap), y=sy+r*(ph+gap);
   sctx.drawImage(tmp,x,y,pw,ph); sctx.strokeStyle='#ccc'; sctx.strokeRect(x,y,pw,ph);
 }}
 sctx.fillStyle='#000'; sctx.font='14px Arial'; sctx.fillText('formatpure.github.io - FREE FOREVER',12,sheetC.height-10);
 showGuide=true; drawCrop();
};

document.getElementById('downSingleBtn').onclick=()=>{
 if(!img){alert('Upload first'); return;}
 showGuide=false; drawCrop();
 let a=document.createElement('a'); a.download='passport-formatpure.png'; a.href=cropC.toDataURL('image/png'); a.click();
 showGuide=true; drawCrop();
};
document.getElementById('downSheetBtn').onclick=()=>{
 let a=document.createElement('a'); a.download='A4-sheet-formatpure.png'; a.href=sheetC.toDataURL('image/png'); a.click();
};
</script>
</body></html>
