<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Thumbnail Downloader HD - FormatPure</title>
<meta name="description" content="Free YouTube Thumbnail Downloader. Download HD, 4K thumbnails in one click. No watermark.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f172a;color:#fff;min-height:100vh;padding:20px}
.container{max-width:800px;margin:auto}
h1{text-align:center;color:#38bdf8;font-size:28px;margin:20px 0 8px}
.sub{text-align:center;color:#94a3b8;margin-bottom:25px}
.input-box{display:flex;gap:10px;margin-bottom:25px}
input{flex:1;padding:15px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:16px}
button.get{background:#ef4444;color:#fff;border:none;padding:0 25px;border-radius:12px;font-weight:bold;cursor:pointer;font-size:16px}
button.get:hover{background:#dc2626}
#result{display:none}
.preview{text-align:center;margin-bottom:20px}
.preview img{max-width:100%;border-radius:12px;border:1px solid #334155}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:15px;text-align:center}
.card img{width:100%;border-radius:8px;margin-bottom:10px;aspect-ratio:16/9;object-fit:cover}
.card.q{font-weight:bold;color:#38bdf8;margin-bottom:8px}
.card a{display:block;background:#22c55e;color:#000;text-decoration:none;padding:10px;border-radius:8px;font-weight:bold;font-size:14px}
.card a:hover{background:#16a34a}
.back{text-align:center;margin-top:30px}
.back a{color:#38bdf8;text-decoration:none}
.error{background:#ef4444;padding:12px;border-radius:8px;text-align:center;margin-bottom:20px;display:none}
</style>
</head>
<body>
<div class="container">
<h1>🖼️ Thumbnail Downloader</h1>
<p class="sub">Paste YouTube link → Get HD thumbnails free</p>

<div class="input-box">
<input id="url" placeholder="Paste YouTube URL here... e.g. https://youtube.com/watch?v=...">
<button class="get" onclick="getThumbs()">Get</button>
</div>

<div id="err" class="error">Invalid YouTube URL. Please check and try again.</div>

<div id="result">
<div class="preview">
<img id="mainImg" src="">
</div>
<div class="grid" id="grid"></div>
</div>

<div class="back"><a href="index.html">← Back to FormatPure</a></div>
</div>

<script>
function getVideoId(url){
  const reg = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
  const m = url.match(reg);
  return m? m[1] : null;
}
function getThumbs(){
  const url = document.getElementById('url').value.trim();
  const id = getVideoId(url);
  const err = document.getElementById('err');
  const res = document.getElementById('result');
  if(!id){ err.style.display='block'; res.style.display='none'; return; }
  err.style.display='none';
  res.style.display='block';
  const quals = [
    {name:'4K Ultra HD', file:'maxresdefault', q:'1280x720'},
    {name:'HD', file:'sddefault', q:'640x480'},
    {name:'Medium', file:'hqdefault', q:'480x360'},
    {name:'Small', file:'mqdefault', q:'320x180'}
  ];
  document.getElementById('mainImg').src = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  quals.forEach(q=>{
    const imgUrl = `https://img.youtube.com/vi/${id}/${q.file}.jpg`;
    grid.innerHTML += `
      <div class="card">
        <img src="${imgUrl}" onerror="this.src='https://img.youtube.com/vi/${id}/hqdefault.jpg'">
        <div class="q">${q.name}<br><small style="color:#94a3b8">${q.q}</small></div>
        <a href="${imgUrl}" download="thumbnail-${q.file}.jpg" target="_blank">Download</a>
      </div>`;
  });
}
document.getElementById('url').addEventListener('keypress', e=>{ if(e.key==='Enter') getThumbs(); });
</script>
</body>
</html>
