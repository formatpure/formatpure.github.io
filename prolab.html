<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProLab - Invoice Generator | FormatPure</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
body{background:#0f172a;color:white;font-family:Inter,sans-serif;padding:15px}
.card{background:white;color:black;border-radius:16px;padding:20px;max-width:400px;margin:auto}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd}
button{background:#2563eb;color:white;padding:14px;width:100%;border:none;border-radius:10px;font-weight:bold;margin-top:10px}
#invoice{margin-top:20px;background:white;color:black;padding:20px;border-radius:12px;border:2px dashed #2563eb}
</style>
</head>
<body>
<h2 style="text-align:center">ProLab 💼 Invoice Generator</h2>

<input id="biz" placeholder="Your Business Name: FormatPure Studio">
<input id="client" placeholder="Client Name: Ali Traders">
<input id="amount" placeholder="Amount: 50000" type="number">
<input id="service" placeholder="Service: Website Design">

<button onclick="makeInvoice()">Generate Invoice</button>

<div id="invoice" style="display:none">
  <h3 style="margin:0">INVOICE</h3>
  <p id="outBiz" style="font-weight:bold"></p>
  <hr>
  <p>Bill To: <span id="outClient"></span></p>
  <p>Service: <span id="outService"></span></p>
  <h2 style="color:#2563eb">Rs. <span id="outAmount"></span></h2>
  <p style="font-size:11px;color:gray">Generated by formatpure.github.io - Professional Tools</p>
</div>

<button id="dl" style="display:none;background:#10b981" onclick="download()">Download Invoice Poster</button>

<script>
function makeInvoice(){
  document.getElementById('invoice').style.display='block';
  document.getElementById('dl').style.display='block';
  document.getElementById('outBiz').innerText = document.getElementById('biz').value;
  document.getElementById('outClient').innerText = document.getElementById('client').value;
  document.getElementById('outService').innerText = document.getElementById('service').value;
  document.getElementById('outAmount').innerText = document.getElementById('amount').value;
}
function download(){
  html2canvas(document.getElementById('invoice')).then(c=>{
    let a=document.createElement('a');
    a.download='invoice-formatpure.png';
    a.href=c.toDataURL();
    a.click();
  });
}
</script>
</body>
</html>
