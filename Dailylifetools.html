<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STUDENTS LAB - 33 Tools</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{background:#08081a;color:#fff;margin:0;padding:10px}
.h{max-width:1200px;margin:auto;text-align:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0;max-height:140px;overflow:auto}
.tab{padding:8px 12px;background:#222;border-radius:15px;cursor:pointer;font-size:13px}
.tab.active{background:#7c3aed}
.panel{display:none;background:#12122a;padding:15px;border-radius:10px;max-width:1100px;margin:10px auto}
.panel.active{display:block}
textarea{width:100%;height:100px;background:#000;color:#fff;border:1px solid #444;border-radius:8px;padding:8px}
button{background:#7c3aed;color:#fff;border:none;padding:8px 14px;border-radius:7px;margin:4px;cursor:pointer}
input,select{padding:8px;border-radius:6px;border:none;margin:4px;background:#222;color:#fff}
.card{background:#1e1e3a;padding:10px;margin:6px 0;border-radius:8px}
table{width:100%;border-collapse:collapse;background:#fff;color:#000}th,td{border:1px solid #ddd;padding:8px}th{background:#7c3aed;color:#fff}
.brand{opacity:.6;font-size:11px;text-align:center;margin-top:10px}
</style></head><body>
<div class="h"><h1>🎓 STUDENTS LAB</h1><p>33 Free Student Tools • studentslab.web.app</p>
<textarea id="mainText" placeholder="Paste chapter text here (for Summary/MCQ/QA/Pass Checker)"></textarea></div>

<div class="tabs" id="tabs"></div>
<div id="panels"></div>
<div class="brand">© 2026 STUDENTS LAB • Powered by STUDENTS LAB</div>

<script>
const tools=[
["summary","📝 Summary"],["timetable","📅 Timetable"],["timer","⏱️ Timer"],["mcq","❓ MCQs"],["short","✍️ Short QA"],["long","📖 Long QA"],["pass","✅ Pass%"],
["notes","📓 Notes"],["todo","☑️ To-Do"],["words","🔢 Word Count"],["gpa","🎓 GPA Calc"],["attend","📊 Attendance"],["flash","🃏 Flashcards"],["stopw","⏱️ Stopwatch"],["unit","🔄 Unit Conv"],["age","🎂 Age Calc"],
["sci","🧮 Sci Calc"],["syllabus","📚 Syllabus"],["picker","🎲 Picker"],["essay","✍️ Essay"],["cite","📑 Citation"],["dict","📖 Dictionary"],["countdown","⏳ Countdown"],["voice","🎤 Voice Notes"],["percent","% Percent"],["bmi","⚖️ BMI"],["datediff","📆 Date Diff"],["pwd","🔑 Password"],["tts","🔊 Text Speech"],["formula","📐 Formulas"],["qrcode","⬛ QR Text"],["mindmap","🧠 Mindmap"],["planner","🗓️ Planner"]
];
let tabsH="",panH="";
tools.forEach((t,i)=>{
tabsH+=`<div class="tab ${i==0?'active':''}" onclick="show('${t[0]}',event)">${t[1]}</div>`;
panH+=`<div id="p-${t[0]}" class="panel ${i==0?'active':''}"><h2>${t[1]}</h2><div id="c-${t[0]}"></div><div class="brand">Powered by STUDENTS LAB</div><button onclick="dl('${t[0]}')">📸 Image</button> <button onclick="window.print()">📄 PDF</button></div>`;
});
document.getElementById('tabs').innerHTML=tabsH;
document.getElementById('panels').innerHTML=panH;
function show(id,e){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.getElementById('p-'+id).classList.add('active')}
function dl(id){html2canvas(document.getElementById('p-'+id)).then(c=>{let a=document.createElement('a');a.download=id+'.png';a.href=c.toDataURL();a.click()})}
function getS(){return document.getElementById('mainText').value.match(/[^.!?]+[.!?]+/g)||[]}

// INIT CONTENT
document.getElementById('c-summary').innerHTML=`<button onclick="genSum()">Generate</button><div id="sumOut"></div>`;
document.getElementById('c-timetable').innerHTML=`<input id="tt_s" placeholder="Bio,Chem,Phy"><input id="tt_h" type="number" value="6" style="width:70px"><input type="time" id="tt_t" value="09:00"><input id="tt_b" type="number" value="15" style="width:70px" placeholder="break"><button onclick="genTT()">Create</button><div id="ttOut"></div>`;
document.getElementById('c-timer').innerHTML=`<h1 id="tm">25:00</h1><button onclick="tStart()">Start</button><button onclick="tStop()">Stop</button>`;
document.getElementById('c-mcq').innerHTML=`<select id="mqN"><option>50</option><option>100</option><option>300</option><option>500</option></select><button onclick="genMCQ()">Generate</button><div id="mqO"></div>`;
document.getElementById('c-short').innerHTML=`<button onclick="genQA('short')">100 Short</button><div id="shO"></div>`;
document.getElementById('c-long').innerHTML=`<button onclick="genQA('long')">50 Long</button><div id="loO"></div>`;
document.getElementById('c-pass').innerHTML=`<button onclick="checkPass()">Check Pass%</button><div id="passO"></div>`;
document.getElementById('c-notes').innerHTML=`<textarea id="nt" placeholder="Write notes..."></textarea><button onclick="localStorage.setItem('nt',document.getElementById('nt').value);alert('Saved')">Save</button><button onclick="document.getElementById('nt').value=localStorage.getItem('nt')||''">Load</button>`;
document.getElementById('c-todo').innerHTML=`<input id="tdI" placeholder="Task"><button onclick="addTodo()">Add</button><ul id="tdL"></ul>`;
document.getElementById('c-words').innerHTML=`<button onclick="document.getElementById('wcO').innerText='Words: '+document.getElementById('mainText').value.trim().split(/\\s+/).length">Count Main Text</button><div id="wcO"></div>`;
document.getElementById('c-gpa').innerHTML=`<input id="g1" placeholder="Obtained" type="number"><input id="g2" placeholder="Total" type="number"><button onclick="document.getElementById('gO').innerText='%: '+(g1.value/g2.value*100).toFixed(2)">Calc</button><div id="gO"></div>`;
document.getElementById('c-attend').innerHTML=`<input id="a1" type="number" placeholder="Present"><input id="a2" type="number" placeholder="Total"><button onclick="document.getElementById('aO').innerText='Attendance: '+(a1.value/a2.value*100).toFixed(1)+'%'">Calc</button><div id="aO"></div>`;
document.getElementById('c-flash').innerHTML=`<button onclick="mkFlash()">Make from Text</button><div id="flO"></div>`;
document.getElementById('c-stopw').innerHTML=`<h2 id="sw">0s</h2><button onclick="swStart()">Start</button><button onclick="swStop()">Stop</button>`;
document.getElementById('c-unit').innerHTML=`<input id="u1" type="number" placeholder="cm"><button onclick="document.getElementById('uO').innerText=u1.value+' cm = '+(u1.value/100)+' m'">To Meter</button><div id="uO"></div>`;
document.getElementById('c-age').innerHTML=`<input type="date" id="dob"><button onclick="document.getElementById('ageO').innerText='Age: '+new Date().getFullYear()+'-'+new Date(dob.value).getFullYear()">Calc</button><div id="ageO"></div>`;
document.getElementById('c-sci').innerHTML=`<input id="sciI" placeholder="2+2*3"><button onclick="document.getElementById('sciO').innerText=eval(sciI.value)">=</button><div id="sciO"></div>`;
document.getElementById('c-syllabus').innerHTML=`<input id="syI" placeholder="Chapter 1"><button onclick="syAdd()">Add</button><ul id="syL"></ul>`;
document.getElementById('c-picker').innerHTML=`<textarea id="pkI" placeholder="Ali, Ahmed, Sara"></textarea><button onclick="let a=pkI.value.split(',');alert(a[Math.floor(Math.random()*a.length)])">Pick Random</button>`;
document.getElementById('c-essay').innerHTML=`<input id="esT" placeholder="Topic"><button onclick="esO.innerHTML='<b>Intro:</b> '+esT.value+' is important...<br><b>Body:</b> Firstly... Secondly...<br><b>Conclusion:</b> In conclusion...'">Build</button><div id="esO" class="card"></div>`;
document.getElementById('c-cite').innerHTML=`<input id="ciA" placeholder="Author"><input id="ciY" placeholder="Year"><input id="ciT" placeholder="Title"><button onclick="ciO.innerText=ciA.value+' ('+ciY.value+'). '+ciT.value+'.'">APA</button><div id="ciO"></div>`;
document.getElementById('c-dictionary').innerHTML=`<input id="dictW" placeholder="Type word: layout" style="width:65%;padding:8px"><button onclick="defineDict()" style="padding:8px">Define</button><div id="dictO" style="margin-top:10px;text-align:left;padding:10px"></div>`;
document.getElementById('c-countdown').innerHTML=`<input type="date" id="cdD"><button onclick="let d=Math.ceil((new Date(cdD.value)-new Date())/86400000);cdO.innerText=d+' days left'">Start</button><div id="cdO"></div>`;
document.getElementById('c-voice').innerHTML=`<button onclick="vr()">🎤 Speak</button><div id="vO"></div>`;
document.getElementById('c-percent').innerHTML=`<input id="p1" type="number" placeholder="part"><input id="p2" type="number" placeholder="whole"><button onclick="pcO.innerText=(p1.value/p2.value*100)+'%'">Calc</button><div id="pcO"></div>`;
document.getElementById('c-bmi').innerHTML=`<input id="b1" type="number" placeholder="kg"><input id="b2" type="number" placeholder="m"><button onclick="bmiO.innerText='BMI: '+(b1.value/(b2.value*b2.value)).toFixed(1)">Calc</button><div id="bmiO"></div>`;
document.getElementById('c-datediff').innerHTML=`<input type="date" id="dd1"><input type="date" id="dd2"><button onclick="ddO.innerText=Math.abs((new Date(dd2.value)-new Date(dd1.value))/86400000+' days'">Diff</button><div id="ddO"></div>`;
document.getElementById('c-pwd').innerHTML=`<button onclick="pwdO.innerText=Math.random().toString(36).slice(2,10)">Generate</button><div id="pwdO"></div>`;
document.getElementById('c-tts').innerHTML=`<button onclick="speechSynthesis.speak(new utterancespeech())">Placeholder</button><button onclick="speechSynthesis.speak(new SpeechSynthesisUtterance(document.getElementById('mainText').value.slice(0,200)))">🔊 Read Text</button>`;
document.getElementById('c-formula').innerHTML=`<div class="card">a²+b²=c²<br>Speed=Distance/Time<br>% = part/whole×100</div>`;
document.getElementById('c-qrcode').innerHTML=`<input id="qrT" placeholder="Text"><button onclick="qrO.innerText='QR: '+qrT.value+' (use online lib for real QR)'">Make</button><div id="qrO"></div>`;
 document.getElementById('c-mindmap').innerHTML=`<input id="mmT" placeholder="Central idea"><button onclick="drawMM()">Draw Smart</button><div id="mmO" class="card" style="text-align:left"></div>`;
document.getElementById('c-planner').innerHTML=`<input id="plD" type="date"><input id="plT" placeholder="Task"><button onclick="plL.innerHTML+='<li>'+plD.value+': '+plT.value+'</li>'">Add</button><ul id="plL"></ul>`;

function drawMM(){let central=document.getElementById('mmT').value||"Main Topic";let text=document.getElementById('mainText').value;let s=text.match(/[^.!?]+[.!?]+/g)||[];let pts=s.slice(0,5).map((x,i)=> (i==4||i==s.slice(0,5).length-1?'└─ ':'├─ ')+x.trim().substring(0,60));if(pts.length<3)pts=["├─ What is it?","├─ Why important?","└─ Example"];document.getElementById('mmO').innerHTML='🧠 <b>'+central+'</b><br>'+pts.join('<br>');}
 
 // FUNCTIONS
function genSum(){let s=getS();document.getElementById('sumOut').innerHTML="<p>"+s.slice(0,20).join(' ')+"</p>"}
function genTT(){let subs=document.getElementById('tt_s').value.split(',');let h=+document.getElementById('tt_t').value.split(':')[0],m=+document.getElementById('tt_t').value.split(':')[1];let hrs=+document.getElementById('tt_h').value;let br=+document.getElementById('tt_b').value;let html="<table><tr><th>Time</th><th>Subject</th></tr>";for(let i=0;i<hrs;i++){let t1=`${h}:${String(m).padStart(2,'0')}`;m+=60;if(m>=60){h++;m-=60}let t2=`${h}:${String(m).padStart(2,'0')}`;html+=`<tr><td>${t1}-${t2}</td><td>${subs[i%subs.length]||'Study'}</td></tr>`;if(i<hrs-1)html+=`<tr style="background:#fef3c7"><td colspan=2>☕ BREAK ${br}min</td></tr>`;m+=br;if(m>=60){h++;m-=60}}document.getElementById('ttOut').innerHTML=html+"</table>"}
let tInt;function tStart(){let s=25*60;clearInterval(tInt);tInt=setInterval(()=>{s--;let mm=Math.floor(s/60),ss=s%60;document.getElementById('tm').innerText=`${mm}:${ss}`;if(s<=0)clearInterval(tInt)},1000)}function tStop(){clearInterval(tInt)}
function genMCQ(){let n=+document.getElementById('mqN').value;let s=getS();let o="";for(let i=0;i<n;i++){let txt=(s[i%s.length]||"Paste text").substring(0,60);o+=`<div class="card"><b>Q${i+1}.</b> ${txt}...<br>A) Correct B) Wrong C) Wrong D) Wrong</div>`}document.getElementById('mqO').innerHTML=o}
function genQA(t){let s=getS();let n=t=='short'?20:10;let h="";for(let i=0;i<n;i++)h+=`<div class="card"><b>Q:</b> ${(s[i%s.length]||"").substring(0,60)}<br><b>A:</b> ${s[i%s.length]||""}</div>`;document.getElementById(t=='short'?'shO':'loO').innerHTML=h}
function checkPass(){let w=document.getElementById('mainText').value.trim().split(/\s+/).length;let sc=Math.min(95,Math.floor(w/2500*80)+10);document.getElementById('passO').innerHTML=`<h3>Pass Chance: ${sc}%</h3><div style="background:#333;height:15px;border-radius:10px"><div style="width:${sc}%;height:100%;background:#10b981"></div></div>${sc>=80?'✅ Ready!':'Paste 2500+ words for 80%+'}`}
function addTodo(){let li=document.createElement('li');li.textContent=document.getElementById('tdI').value;document.getElementById('tdL').appendChild(li)}
function mkFlash(){let s=getS().slice(0,10);document.getElementById('flO').innerHTML=s.map(x=>`<div class="card" onclick="this.innerHTML=this.innerHTML.includes('Q:')?'A: '+this.dataset.a:'Q: '+this.dataset.q" data-q="${x.substring(0,50)}" data-a="${x}">Q: ${x.substring(0,50)}</div>`).join('')}
let swt,sws=0;function swStart(){swt=setInterval(()=>{sws++;document.getElementById('sw').innerText=sws+'s'},1000)}function swStop(){clearInterval(swt)}
function syAdd(){let li=document.createElement('li');li.innerHTML=`<input type="checkbox"> ${document.getElementById('syI').value}`;document.getElementById('syL').appendChild(li)}
function vr(){let r=new (window.SpeechRecognition||window.webkitSpeechRecognition)();r.onresult=e=>document.getElementById('vO').innerText=e.results[0][0].transcript;r.start()}
let DICT={"layout":"the way parts of something are arranged","html":"language used to create structure of web pages","css":"language used to style websites with colors and fonts","javascript":"language that makes websites interactive","website":"a set of pages on the internet","computer":"electronic device for storing and processing data","mobile":"portable phone device","internet":"global network connecting computers","hosting":"service to publish website online","design":"plan to create something","structure":"basic framework or organization","style":"way of appearance","interactive":"responding to user actions","button":"clickable element","form":"area to input information","test":"to check quality","publish":"to make public online","book":"set of printed pages","study":"to learn","school":"place for education","teacher":"person who teaches","student":"person who learns","exam":"test of knowledge","pass":"to succeed","fail":"to not succeed","dictionary":"book listing words with meanings","essay":"short piece of writing","syllabus":"outline of course topics","citation":"reference to source","percent":"out of hundred","bmi":"body mass index health measure","countdown":"timer counting down","voice":"sound from mouth","note":"short written record","age":"how old someone is","picker":"tool to choose randomly","science":"study of nature","calculator":"device for math","word":"unit of language","meaning":"definition of word","example":"sample to explain","important":"having value","planning":"making a plan","development":"process of growth","finally":"at the end","after":"later than"};
function defineDict(){let w=document.getElementById('dictW').value.toLowerCase().trim();let m=DICT[w];if(m){document.getElementById('dictO').innerHTML='📖 <b>'+w+'</b>: '+m;}else{document.getElementById('dictO').innerHTML='❌ Not found offline. Try: html, css, layout, website, computer, study, exam';}}


</script></body></html>
